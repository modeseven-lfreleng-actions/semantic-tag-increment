# Verifies action/workflow calls are pinned to SHA commit values
name: 'Check GitHub Workflows'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'main'
      - 'master'
    paths: ['.github/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: Verify
    # yamllint disable-line rule:line-length
    uses: lfit/releng-reusable-workflows/.github/workflows/reuse-verify-github-actions.yaml@973bba87aa9cc4ab43242ba9afac37d70c72f134 # v0.9.1
    permissions:
      contents: read
